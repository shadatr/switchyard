name: switchyard

services:
  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: switchyard
      POSTGRES_PASSWORD: switchyard
      POSTGRES_DB: switchyard
    ports: ["15432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchyard -d switchyard"]
      interval: 2s
      timeout: 2s
      retries: 15

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: switchyard
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: switchyard
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["18123:8123", "19000:9000"]
    volumes: ["chdata:/var/lib/clickhouse"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Gateway + mock upstream in containers: docker compose --profile full up -d --build
  switchyard:
    profiles: ["full"]
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: switchyard:dev
    environment:
      SWITCHYARD_PG_DSN: postgres://switchyard:switchyard@postgres:5432/switchyard?sslmode=disable
      SWITCHYARD_CH_PASSWORD: switchyard
      SWITCHYARD_ADMIN_TOKEN: ${SWITCHYARD_ADMIN_TOKEN:-change-me}
    ports: ["8787:8787"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      mockllm: { condition: service_started }

  mockllm:
    profiles: ["full"]
    image: switchyard:dev
    entrypoint: ["/mockllm"]
    command: ["-addr", ":9797", "-ttft", "150ms", "-itl", "15ms", "-tokens", "60", "-jitter", "0.3"]

  # Tracing UI (optional): docker compose --profile tracing up -d
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["tracing"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["4318:4318", "16686:16686"]

volumes:
  pgdata:
  chdata:
