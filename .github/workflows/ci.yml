name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Lint
        run: make lint
      - name: Unit tests (race)
        run: make test
      - name: Fuzz SSE parser (30s)
        run: go test -run=^$ -fuzz=FuzzReader -fuzztime=30s ./internal/sse
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build
        run: make build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: switchyard, POSTGRES_PASSWORD: switchyard, POSTGRES_DB: switchyard }
        ports: ["15432:5432"]
        options: --health-cmd "pg_isready -U switchyard" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env: { CLICKHOUSE_DB: switchyard, CLICKHOUSE_USER: default, CLICKHOUSE_PASSWORD: switchyard, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1" }
        ports: ["18123:8123", "19000:9000"]
        options: --health-cmd "wget --spider -q http://localhost:8123/ping" --health-interval 2s --health-retries 30
    env:
      SWITCHYARD_PG_DSN: postgres://switchyard:switchyard@localhost:15432/switchyard?sslmode=disable
      SWITCHYARD_CH_PASSWORD: switchyard
      SWITCHYARD_TEST_REDIS: localhost:16379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Integration tests against real Postgres, Redis and ClickHouse
        run: go test -race -tags integration ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile --build-arg VERSION=${{ github.sha }} -t switchyard:ci .
